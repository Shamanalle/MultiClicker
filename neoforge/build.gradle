plugins {
    id 'com.github.johnrengelman.shadow'
}

// NeoForge for Minecraft 1.20.2 and newer. For 1.20.1 NeoForge is a fork of Forge 47 (net.neoforged:forge)
// with the Forge API, so the jar is built as a Forge mod. Versions that name a forge_version (1.19 to 1.20)
// get a Forge jar built against Forge itself.
def legacyForge = rootProject.legacyForge
def forgeVersion = rootProject.findProperty('forge_version')

architectury {
    platformSetupLoomIde()
    if (legacyForge) {
        forge()
    } else {
        neoForge()
    }
}

if (legacyForge) {
    loom {
        forge {
            mixinConfig 'multiclicker.mixins.json'
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    if (legacyForge) {
        developmentForge.extendsFrom common
    } else {
        developmentNeoForge.extendsFrom common
    }

    // Files in this configuration will be bundled into the mod using the Shadow plugin.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://maven.neoforged.net/releases' }
    maven { url 'https://maven.minecraftforge.net/' }
}

dependencies {
    if (forgeVersion) {
        forge "net.minecraftforge:forge:$forgeVersion"
    } else if (legacyForge) {
        forge "net.neoforged:forge:$rootProject.neoforge_version"
    } else {
        neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: legacyForge ? 'transformProductionForge' : 'transformProductionNeoForge')
}

// mods.toml was renamed to neoforge.mods.toml in NeoForge for 1.20.5.
def modsToml = rootProject.java_version == '17' ? 'mods.toml' : 'neoforge.mods.toml'

// The Minecraft versions this jar is released for (versions/shared-jars.txt).
def releasedFor = rootProject.releasedFor(forgeVersion ? 'forge' : 'neoforge')

processResources {
    def minecraftRange = releasedFor.versions.size() == 1 ? "[${releasedFor.versions[0]}]"
            : "[${releasedFor.versions.first()},${releasedFor.versions.last()}]"
    // A Forge jar released for several versions accepts the Forge of the oldest of them.
    def oldest = new Properties()
    rootProject.file("versions/${releasedFor.versions[0]}.properties").withInputStream { oldest.load(it) }
    def loaderRange = forgeVersion ? "[${oldest.getProperty('forge_version').split('-')[1].split('\\.')[0]},)"
            : legacyForge ? '[47,)' : '[1,)'
    inputs.property 'version', project.version
    inputs.property 'minecraft_range', minecraftRange
    inputs.property 'mods_toml', modsToml
    inputs.property 'loader_range', loaderRange

    filesMatching('META-INF/mods.toml') {
        expand version: project.version, minecraft_range: minecraftRange,
                loader_range: loaderRange,
                loader: legacyForge ? 'forge' : 'neoforge',
                display_test: legacyForge ? 'displayTest = "IGNORE_ALL_VERSION"' : '',
                mixins: legacyForge ? '' : '[[mixins]]\nconfig = "multiclicker.mixins.json"'
        path = "META-INF/$modsToml"
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    // MultiClicker-neoforge-<mod version>+<minecraft version>.jar, or +<oldest>-<newest> for a shared jar
    archiveVersion = "${rootProject.mod_version}+${releasedFor.label}"
}

// Forge 41, 42 and 44 (Minecraft 1.19, 1.19.1 and 1.19.3) ship ASM 9.3, which cannot read the classes of
// Java 21, so the game only starts on Java 17 there, as it does for players. Gradle finds that JDK through
// the JAVA_HOME_17_X64 variable (see gradle.properties).
def forgeMajor = forgeVersion ? forgeVersion.split('-')[1].split('\\.')[0].toInteger() : 0
if (forgeMajor in [41, 42, 44]) {
    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    }
}
