// NeoForge for Minecraft 26.1 and newer, built with ModDevGradle. The game is not obfuscated, so the classes of the
// common module (compiled by Fabric Loom against the same Minecraft names) go into the jar as they are.
evaluationDependsOn(':common')

def commonOutput = project(':common').sourceSets.main.output

neoForge {
    version = rootProject.neoforge_version

    runs {
        client {
            client()
        }
    }

    mods {
        multiclicker {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

dependencies {
    implementation files(commonOutput)
}

// The Minecraft versions this jar is released for (versions/shared-jars.txt).
def releasedFor = rootProject.releasedFor('neoforge')

processResources {
    def minecraftRange = releasedFor.versions.size() == 1 ? "[${releasedFor.versions[0]}]"
            : "[${releasedFor.versions.first()},${releasedFor.versions.last()}]"
    inputs.property 'version', project.version
    inputs.property 'minecraft_range', minecraftRange

    filesMatching('META-INF/mods.toml') {
        expand version: project.version, minecraft_range: minecraftRange,
                loader_range: '[1,)', loader: 'neoforge', display_test: '',
                mixins: '[[mixins]]\nconfig = "multiclicker.mixins.json"'
        path = 'META-INF/neoforge.mods.toml'
    }
}

jar {
    // The common module is part of the mod jar.
    from commonOutput
    // MultiClicker-neoforge-<mod version>+<minecraft version>.jar, or +<oldest>-<newest> for a shared jar
    archiveVersion = "${rootProject.mod_version}+${releasedFor.label}"
}
