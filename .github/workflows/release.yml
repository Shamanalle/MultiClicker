name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v2.1.0); created from the selected branch if missing'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { mc: "1.19", java: 21 }
          - { mc: "1.19.1", java: 21 }
          - { mc: "1.19.2", java: 21 }
          - { mc: "1.19.3", java: 21 }
          - { mc: "1.19.4", java: 21 }
          - { mc: "1.20", java: 21 }
          - { mc: "1.20.1", java: 21 }
          - { mc: "1.20.2", java: 21 }
          - { mc: "1.20.3", java: 21 }
          - { mc: "1.20.4", java: 21 }
          - { mc: "1.20.5", java: 21 }
          - { mc: "1.20.6", java: 21 }
          - { mc: "1.21", java: 21 }
          - { mc: "1.21.1", java: 21 }
          - { mc: "1.21.2", java: 21 }
          - { mc: "1.21.3", java: 21 }
          - { mc: "1.21.4", java: 21 }
          - { mc: "1.21.5", java: 21 }
          - { mc: "1.21.6", java: 21 }
          - { mc: "1.21.7", java: 21 }
          - { mc: "1.21.8", java: 21 }
          - { mc: "1.21.9", java: 21 }
          - { mc: "1.21.10", java: 21 }
          - { mc: "1.21.11", java: 21 }
          - { mc: "26.1", java: 25 }
          - { mc: "26.1.1", java: 25 }
          - { mc: "26.1.2", java: 25 }
          - { mc: "26.2", java: 25 }
          - { mc: "26.3", java: 25 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      # Minecraft 26.1 and newer is built with Gradle 9; older versions use the wrapper.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ startsWith(matrix.mc, '26.') && '9.8.0' || 'wrapper' }}

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          gradle_cmd=${{ startsWith(matrix.mc, '26.') && 'gradle' || './gradlew' }}
          $gradle_cmd build --no-daemon -Pminecraft_version=${{ matrix.mc }}

      # NeoForge for 1.20.1 is a Forge 47 fork, so its jar runs on Forge 1.20.1 too. It is also published
      # under the Forge name, so Forge players find a file named for their loader.
      - name: Copy the 1.20.1 jar for Forge
        if: matrix.mc == '1.20.1'
        run: |
          for jar in neoforge/build/libs/MultiClicker-neoforge-*+1.20.1.jar; do
            cp "$jar" "${jar/MultiClicker-neoforge-/MultiClicker-forge-}"
          done

      # The Fabric jar and the NeoForge (1.20.1 and newer) and/or Forge (1.19 to 1.20.1) jar.
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: |
            fabric/build/libs/MultiClicker-fabric-*+${{ matrix.mc }}.jar
            neoforge/build/libs/MultiClicker-neoforge-*+${{ matrix.mc }}.jar
            neoforge/build/libs/MultiClicker-forge-*+${{ matrix.mc }}.jar
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: jars

      # The jars keep the build folders (fabric/build/libs, neoforge/build/libs) when a version has both; put them side by side.
      - name: Gather jars
        run: find jars -mindepth 2 -name '*.jar' -exec mv -t jars {} +

      - name: Prepare release
        id: prep
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(sed -n 's/^mod_version *= *//p' gradle.properties | tr -d '[:space:]')"
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::Tag $tag does not match mod_version $version"
            exit 1
          fi
          ls -1 jars
          test "$(ls -1 jars/MultiClicker-fabric-*.jar | wc -l)" -eq 29
          test "$(ls -1 jars/MultiClicker-neoforge-*.jar | wc -l)" -eq 23
          test "$(ls -1 jars/MultiClicker-forge-*.jar | wc -l)" -eq 7
          # Release notes: the CHANGELOG section of this version.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found
          ' CHANGELOG.md > release-notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MultiClicker ${{ steps.prep.outputs.version }}
          body_path: release-notes.md
          files: jars/*.jar
          fail_on_unmatched_files: true

  # Uploads every jar to Modrinth and CurseForge as well. Runs once the project ids are set as repository
  # variables (MODRINTH_ID, CURSEFORGE_ID) and the tokens as secrets (MODRINTH_TOKEN, CURSEFORGE_TOKEN);
  # a site without a token is skipped.
  stores:
    name: Upload ${{ matrix.mc }} to Modrinth and CurseForge
    needs: publish
    if: vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mc: ["1.19", "1.19.1", "1.19.2", "1.19.3", "1.19.4", "1.20", "1.20.1", "1.20.2", "1.20.3", "1.20.4", "1.20.5", "1.20.6", "1.21", "1.21.1", "1.21.2",
             "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11",
             "26.1", "26.1.1", "26.1.2", "26.2", "26.3"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: jars

      # The jars keep the build folders (fabric/build/libs, neoforge/build/libs) when a version has both; put them side by side.
      - name: Gather jars
        run: find jars -mindepth 2 -name '*.jar' -exec mv -t jars {} +

      - name: Prepare upload
        id: prep
        run: |
          version="$(sed -n 's/^mod_version *= *//p' gradle.properties | tr -d '[:space:]')"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found
          ' CHANGELOG.md > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload the Fabric jar
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: jars/MultiClicker-fabric-*.jar
          name: MultiClicker ${{ steps.prep.outputs.version }} for Minecraft ${{ matrix.mc }} (Fabric)
          version: ${{ steps.prep.outputs.version }}+${{ matrix.mc }}-fabric
          version-type: release
          changelog-file: release-notes.md
          loaders: fabric
          game-versions: ${{ matrix.mc }}
          dependencies: |
            fabric-api(required)
            modmenu(optional)

      # NeoForge exists from Minecraft 1.20.1 on.
      - name: Upload the NeoForge jar
        if: hashFiles('jars/MultiClicker-neoforge-*.jar') != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: jars/MultiClicker-neoforge-*.jar
          name: MultiClicker ${{ steps.prep.outputs.version }} for Minecraft ${{ matrix.mc }} (NeoForge)
          version: ${{ steps.prep.outputs.version }}+${{ matrix.mc }}-neoforge
          version-type: release
          changelog-file: release-notes.md
          loaders: neoforge
          game-versions: ${{ matrix.mc }}

      # Forge jars for Minecraft 1.19 to 1.20.1 (for 1.20.1 the copy of the NeoForge jar).
      - name: Upload the Forge jar
        if: hashFiles('jars/MultiClicker-forge-*.jar') != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: jars/MultiClicker-forge-*.jar
          name: MultiClicker ${{ steps.prep.outputs.version }} for Minecraft ${{ matrix.mc }} (Forge)
          version: ${{ steps.prep.outputs.version }}+${{ matrix.mc }}-forge
          version-type: release
          changelog-file: release-notes.md
          loaders: forge
          game-versions: ${{ matrix.mc }}
