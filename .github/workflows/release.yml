name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v2.1.0); created from the selected branch if missing'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { mc: "1.21", java: 21 }
          - { mc: "1.21.1", java: 21 }
          - { mc: "1.21.2", java: 21 }
          - { mc: "1.21.3", java: 21 }
          - { mc: "1.21.4", java: 21 }
          - { mc: "1.21.5", java: 21 }
          - { mc: "1.21.6", java: 21 }
          - { mc: "1.21.7", java: 21 }
          - { mc: "1.21.8", java: 21 }
          - { mc: "1.21.9", java: 21 }
          - { mc: "1.21.10", java: 21 }
          - { mc: "1.21.11", java: 21 }
          - { mc: "26.1", java: 25 }
          - { mc: "26.1.1", java: 25 }
          - { mc: "26.1.2", java: 25 }
          - { mc: "26.2", java: 25 }
          - { mc: "26.3", java: 25 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      # Minecraft 26.1 and newer is built with Gradle 9; older versions use the wrapper.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ startsWith(matrix.mc, '26.') && '9.8.0' || 'wrapper' }}

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          gradle_cmd=${{ startsWith(matrix.mc, '26.') && 'gradle' || './gradlew' }}
          $gradle_cmd build --no-daemon -Pminecraft_version=${{ matrix.mc }}

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: fabric/build/libs/MultiClicker-fabric-*+${{ matrix.mc }}.jar
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: jars

      - name: Prepare release
        id: prep
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(sed -n 's/^mod_version *= *//p' gradle.properties | tr -d '[:space:]')"
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::Tag $tag does not match mod_version $version"
            exit 1
          fi
          ls -1 jars
          test "$(ls -1 jars/*.jar | wc -l)" -eq 17
          # Release notes: the CHANGELOG section of this version.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found
          ' CHANGELOG.md > release-notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MultiClicker ${{ steps.prep.outputs.version }}
          body_path: release-notes.md
          files: jars/*.jar
          fail_on_unmatched_files: true
