name: In-game tests

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gametest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gametest:
    name: Client game tests ${{ matrix.mc }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.4", java: 21 }
          - { mc: "1.21.5", java: 21 }
          - { mc: "1.21.6", java: 21 }
          - { mc: "1.21.7", java: 21 }
          - { mc: "1.21.8", java: 21 }
          - { mc: "1.21.9", java: 21 }
          - { mc: "1.21.10", java: 21 }
          - { mc: "1.21.11", java: 21 }
          - { mc: "26.1", java: 25 }
          - { mc: "26.1.1", java: 25 }
          - { mc: "26.1.2", java: 25 }
          - { mc: "26.2", java: 25 }
          - { mc: "26.3", java: 25 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      # Minecraft 26.1 and newer is built with Gradle 9; older versions use the wrapper.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ startsWith(matrix.mc, '26.') && '9.8.0' || 'wrapper' }}

      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1

      - name: Run client game tests
        run: |
          set -o pipefail
          chmod +x gradlew
          gradle_cmd=${{ startsWith(matrix.mc, '26.') && 'gradle' || './gradlew' }}
          # The world sometimes takes longer to load than the test harness waits on a busy runner
          # ("Timeout loading world"). A real failure of a scenario fails both attempts.
          for attempt in 1 2; do
            xvfb-run -a -s "-screen 0 1920x1080x24" $gradle_cmd :fabric:runClientGameTest --no-daemon -Pminecraft_version=${{ matrix.mc }} | tee gametest.log && exit 0
            echo "::warning::Game test attempt $attempt failed"
          done
          exit 1

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-screenshots-${{ matrix.mc }}
          path: fabric/build/run/clientGameTest/screenshots
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs-${{ matrix.mc }}
          path: fabric/build/run/clientGameTest/logs
          if-no-files-found: ignore

  # Fabric API for Minecraft 1.21 to 1.21.3 has no client game test API, so these versions only get a
  # smoke run: the game is started up to the resource reload and the log is checked for the mod
  # loading and for mixin failures.
  smoke:
    name: Start-up check ${{ matrix.mc }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21", java: 21 }
          - { mc: "1.21.1", java: 21 }
          - { mc: "1.21.2", java: 21 }
          - { mc: "1.21.3", java: 21 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1

      - name: Start the game
        run: |
          chmod +x gradlew
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 240 ./gradlew :fabric:runClient --no-daemon -Pminecraft_version=${{ matrix.mc }} | tee smoke.log || true

      - name: Check the log
        run: |
          grep -q "MultiClicker .* initialized" smoke.log
          grep -q "Reloading ResourceManager" smoke.log
          ! grep -E "InjectionError|Mixin apply failed|Critical injection failure|Mixin transformation of .* failed" smoke.log
