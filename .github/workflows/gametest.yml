name: In-game tests

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  gametest:
    name: Client game tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri

      - name: Run client game tests
        run: |
          chmod +x gradlew
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :fabric:runClientGameTest --no-daemon --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-screenshots
          path: fabric/build/run/clientGameTest/screenshots
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: fabric/build/run/clientGameTest/logs
          if-no-files-found: ignore
