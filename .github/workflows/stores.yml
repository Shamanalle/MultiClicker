name: Upload to stores

# Uploads the jars of a GitHub release to Modrinth and CurseForge. The release workflow runs it after
# publishing; run it by hand to finish a release whose uploads failed (for example on Modrinth's daily limit).
# Files a store already has are skipped, so running it again never uploads a jar twice: Modrinth is asked for
# the version number, and a CurseForge upload leaves a marker in the Actions cache (CurseForge's upload API
# cannot list files).
#
# Needs the project ids as repository variables (MODRINTH_ID, CURSEFORGE_ID) and the tokens as secrets
# (MODRINTH_TOKEN, CURSEFORGE_TOKEN); a store without a token is skipped.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v2.5.0'
        required: true
      only:
        description: 'Only these uploads, as loader:versions separated by spaces (for example "forge:1.19-1.20.1 neoforge:26.1-26.3"); empty for all'
        required: false
        default: ''
      stores:
        description: 'Stores to upload to'
        type: choice
        options: [both, modrinth, curseforge]
        default: both

permissions:
  contents: read

jobs:
  entries:
    name: List the jars
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.list.outputs.entries }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: List the jars
        id: list
        env:
          ONLY: ${{ inputs.only }}
        run: |
          python3 .github/scripts/bundle.py entries | python3 -c '
          import json, os, sys
          only = os.environ.get("ONLY", "").split()
          entries = [e for e in json.load(sys.stdin) if not only or e["loader"] + ":" + e["label"] in only]
          if not entries:
              sys.exit("no jar matches: " + " ".join(only))
          # One at a time from the oldest Minecraft version to the newest (Fabric last for each), so a store lists
          # its files newest version first and its newest file (the one CurseForge shows) is for the newest version.
          loaders = ["forge", "neoforge", "fabric"]
          entries.sort(key=lambda e: ([int(p) for p in e["versions"].split()[-1].split(".")], loaders.index(e["loader"])))
          print("entries=" + json.dumps(entries))
          ' >> "$GITHUB_OUTPUT"

  upload:
    name: Upload ${{ matrix.loader }} ${{ matrix.label }} to Modrinth and CurseForge
    needs: entries
    if: vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      # One entry per release jar and loader (bundle.py entries): the jar, its loader and the Minecraft versions
      # it is for.
      matrix:
        include: ${{ fromJSON(needs.entries.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" -p "${{ matrix.file }}" -D jars

      # A jar uploaded for several loaders gets a marker entry naming the loader, so each upload is a different
      # file: Modrinth refuses a file it already has.
      - name: Mark the jar for its loader
        if: matrix.marker
        run: |
          python3 -c '
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1], "a") as jar:
              jar.writestr("META-INF/multiclicker-store-upload.txt", sys.argv[2] + "\n")
          ' "jars/${{ matrix.file }}" "${{ matrix.loader }}"

      # The stores show one changelog to everyone, so the Russian one follows the English one.
      - name: Prepare upload
        id: prep
        run: |
          version="$(sed -n 's/^mod_version *= *//p' gradle.properties | tr -d '[:space:]')"
          python3 .github/scripts/release_notes.py "$version" --russian > release-notes.md
          loader="${{ matrix.loader }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "number=$version+${{ matrix.label }}-$loader" >> "$GITHUB_OUTPUT"
          echo "file=jars/${{ matrix.file }}" >> "$GITHUB_OUTPUT"
          echo "loaders=${{ matrix.loaders }}" >> "$GITHUB_OUTPUT"
          echo "name=${loader^}" | sed 's/Neoforge/NeoForge/' >> "$GITHUB_OUTPUT"
          echo "range=${{ matrix.label }}" | sed 's/-/–/' >> "$GITHUB_OUTPUT"
          {
            echo 'game_versions<<EOF'
            tr ' ' '\n' <<< "${{ matrix.versions }}"
            echo 'EOF'
            echo 'dependencies<<EOF'
            if [ "$loader" = fabric ]; then printf 'fabric-api(required)\nmodmenu(optional)\n'; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Look for the CurseForge upload
        id: curseforge-done
        uses: actions/cache/restore@v4
        with:
          path: curseforge-uploaded
          key: curseforge-${{ steps.prep.outputs.number }}
          lookup-only: true

      - name: Pick the stores
        id: stores
        env:
          STORES: ${{ inputs.stores || 'both' }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_DONE: ${{ steps.curseforge-done.outputs.cache-hit }}
        run: |
          number="${{ steps.prep.outputs.number }}"
          modrinth=false
          if [ "$STORES" != curseforge ] && [ -n "$MODRINTH_TOKEN" ]; then
            status="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: $MODRINTH_TOKEN" \
              "https://api.modrinth.com/v2/project/$MODRINTH_ID/version/$number")"
            if [ "$status" = 200 ]; then
              echo "Modrinth already has $number"
            else
              modrinth=true
            fi
          fi
          curseforge=false
          if [ "$STORES" != modrinth ] && [ -n "$CURSEFORGE_TOKEN" ]; then
            if [ "$CURSEFORGE_DONE" = true ]; then
              echo "CurseForge already has $number"
            else
              curseforge=true
            fi
          fi
          echo "modrinth=$modrinth" >> "$GITHUB_OUTPUT"
          echo "curseforge=$curseforge" >> "$GITHUB_OUTPUT"

      # CurseForge first, and its marker is saved before Modrinth is tried: a job re-run after a Modrinth
      # error must not upload the same file to CurseForge again (which would also put it above the newer uploads).
      - name: Upload the jar to CurseForge
        if: steps.stores.outputs.curseforge == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.prep.outputs.file }}
          name: MultiClicker ${{ steps.prep.outputs.version }} for ${{ steps.prep.outputs.range }} (${{ steps.prep.outputs.name }})
          version: ${{ steps.prep.outputs.number }}
          version-type: release
          changelog-file: release-notes.md
          loaders: ${{ steps.prep.outputs.loaders }}
          game-versions: ${{ steps.prep.outputs.game_versions }}
          dependencies: ${{ steps.prep.outputs.dependencies }}

      - name: Remember the CurseForge upload
        if: steps.stores.outputs.curseforge == 'true'
        run: mkdir -p curseforge-uploaded && echo "${{ steps.prep.outputs.number }}" > curseforge-uploaded/number

      - name: Save the CurseForge marker
        if: steps.stores.outputs.curseforge == 'true'
        uses: actions/cache/save@v4
        with:
          path: curseforge-uploaded
          key: curseforge-${{ steps.prep.outputs.number }}

      - name: Upload the jar to Modrinth
        if: steps.stores.outputs.modrinth == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.prep.outputs.file }}
          name: MultiClicker ${{ steps.prep.outputs.version }} for ${{ steps.prep.outputs.range }} (${{ steps.prep.outputs.name }})
          version: ${{ steps.prep.outputs.number }}
          version-type: release
          changelog-file: release-notes.md
          loaders: ${{ steps.prep.outputs.loaders }}
          game-versions: ${{ steps.prep.outputs.game_versions }}
          dependencies: ${{ steps.prep.outputs.dependencies }}

      # Reads the version back from Modrinth: its file must be the one uploaded (same SHA-512) and it must list the
      # loaders and game versions it was uploaded for, so a store page never offers a wrong or broken file.
      - name: Check the Modrinth version
        if: vars.MODRINTH_ID != ''
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          NUMBER: ${{ steps.prep.outputs.number }}
          FILE: ${{ steps.prep.outputs.file }}
          LOADERS: ${{ steps.prep.outputs.loaders }}
          GAME_VERSIONS: ${{ matrix.versions }}
          UPLOADED: ${{ steps.stores.outputs.modrinth }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys, time, urllib.request
          number = os.environ['NUMBER']
          url = f"https://api.modrinth.com/v2/project/{os.environ['MODRINTH_ID']}/version/{number}"
          headers = {'User-Agent': 'MultiClicker release check'}
          if os.environ.get('MODRINTH_TOKEN'):
              headers['Authorization'] = os.environ['MODRINTH_TOKEN']
          version = None
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                      version = json.load(response)
                  break
              except Exception as error:
                  print(f'{number}: {error}, trying again')
                  time.sleep(10)
          if version is None:
              if os.environ.get('UPLOADED') == 'true' or os.environ.get('MODRINTH_TOKEN'):
                  sys.exit(f'{number}: Modrinth has no such version')
              print(f'{number}: not on Modrinth, nothing to check')
              sys.exit()
          problems = []
          primary = next((f for f in version['files'] if f.get('primary')), version['files'][0])
          local = hashlib.sha512(open(os.environ['FILE'], 'rb').read()).hexdigest()
          # A version uploaded by an earlier run of this workflow may carry the marker of that run only.
          if os.environ.get('UPLOADED') == 'true' and primary['hashes']['sha512'] != local:
              problems.append(f"file {primary['filename']} differs from the uploaded jar")
          with urllib.request.urlopen(urllib.request.Request(primary['url'], headers=headers)) as response:
              if hashlib.sha512(response.read()).hexdigest() != primary['hashes']['sha512']:
                  problems.append(f"the download of {primary['filename']} does not match its SHA-512")
          if sorted(version['loaders']) != sorted(os.environ['LOADERS'].split()):
              problems.append(f"loaders {version['loaders']} instead of {os.environ['LOADERS'].split()}")
          if sorted(version['game_versions']) != sorted(os.environ['GAME_VERSIONS'].split()):
              problems.append(f"game versions {version['game_versions']} instead of {os.environ['GAME_VERSIONS'].split()}")
          if problems:
              sys.exit(f'{number}: ' + '; '.join(problems))
          print(f"{number}: {primary['filename']}, {', '.join(version['loaders'])}, {len(version['game_versions'])} game versions")
          PY
