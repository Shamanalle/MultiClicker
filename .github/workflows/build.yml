name: Build and Verify

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

# A new push to a pull request replaces the build still waiting for the previous one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.19", java: 21 }
          - { mc: "1.19.1", java: 21 }
          - { mc: "1.19.2", java: 21 }
          - { mc: "1.19.3", java: 21 }
          - { mc: "1.19.4", java: 21 }
          - { mc: "1.20", java: 21 }
          - { mc: "1.20.1", java: 21 }
          - { mc: "1.20.2", java: 21 }
          - { mc: "1.20.3", java: 21 }
          - { mc: "1.20.4", java: 21 }
          - { mc: "1.20.5", java: 21 }
          - { mc: "1.20.6", java: 21 }
          - { mc: "1.21", java: 21 }
          - { mc: "1.21.1", java: 21 }
          - { mc: "1.21.2", java: 21 }
          - { mc: "1.21.3", java: 21 }
          - { mc: "1.21.4", java: 21 }
          - { mc: "1.21.5", java: 21 }
          - { mc: "1.21.6", java: 21 }
          - { mc: "1.21.7", java: 21 }
          - { mc: "1.21.8", java: 21 }
          - { mc: "1.21.9", java: 21 }
          - { mc: "1.21.10", java: 21 }
          - { mc: "1.21.11", java: 21 }
          - { mc: "26.1", java: 25 }
          - { mc: "26.1.1", java: 25 }
          - { mc: "26.1.2", java: 25 }
          - { mc: "26.2", java: 25 }
          - { mc: "26.3", java: 25 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      # Minecraft 26.1 and newer is built with Gradle 9; older versions use the wrapper.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ startsWith(matrix.mc, '26.') && '9.8.0' || 'wrapper' }}

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          gradle_cmd=${{ startsWith(matrix.mc, '26.') && 'gradle' || './gradlew' }}
          $gradle_cmd build --no-daemon -Pminecraft_version=${{ matrix.mc }}

      # The Fabric jar and the NeoForge (1.20.1 and newer) or Forge (1.19 to 1.20) jar. A jar shared by a group
      # of versions (versions/shared-jars.txt) is named for the group: +<oldest>-<newest>.jar.
      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: MultiClicker-${{ matrix.mc }}
          path: |
            fabric/build/libs/MultiClicker-fabric-*+*.jar
            neoforge/build/libs/MultiClicker-neoforge-*+*.jar
            neoforge/build/libs/MultiClicker-forge-*+*.jar
          if-no-files-found: error

  # The release publishes one jar for each group of versions/shared-jars.txt; this finds out before a release
  # when a version of a group stops building into the same code.
  shared-jars:
    name: Shared jars
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download jars
        uses: actions/download-artifact@v8
        with:
          pattern: MultiClicker-*
          merge-multiple: true
          path: jars

      - name: Gather jars
        run: find jars -mindepth 2 -name '*.jar' -exec mv -t jars {} +

      # The 1.20.1 NeoForge jar is released under the Forge name too (see release.yml).
      - name: Compare the jars of each group
        run: |
          for jar in jars/MultiClicker-neoforge-*+1.20.1.jar; do cp "$jar" "${jar/MultiClicker-neoforge-/MultiClicker-forge-}"; done
          python3 .github/scripts/release_groups.py check jars
