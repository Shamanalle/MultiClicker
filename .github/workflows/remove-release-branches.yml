name: Remove release branches

# One-off cleanup: deletes the old release/* branches. Removed again right after the run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release/* branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for b in release/1.21.9 release/1.21.11 release/26.1 release/26.2 release/26.3; do
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$b" && echo "deleted $b" || echo "could not delete $b"
          done
          echo "--- left:"
          gh api "repos/$GH_REPO/branches" --jq '.[].name'
