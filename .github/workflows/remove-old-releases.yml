name: Remove old releases

# One-off cleanup: deletes the v1.0.0 releases and their tags. Removed again right after the run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the v1.0.0 releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in "v1.0.0" "v1.0.0+1.21.8" "v1.0.0+1.21.9" "v1.0.0+1.21.11" "v1.0.0+26.1" "v1.0.0+26.2" "v1.0.0+26.3"; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --cleanup-tag --yes && echo "deleted $tag"
            else
              echo "no release $tag"
            fi
          done
          echo "--- left:"
          gh release list --limit 20
