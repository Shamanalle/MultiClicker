name: Modrinth page

# Updates the Modrinth project page: the summary and the description from publishing/modrinth-curseforge.md
# (sections 2 and 3, the Russian one folded), and the gallery from the screenshots in docs/images/en, in the
# order below, the first one featured. Run it by hand after the texts or the screenshots change. CurseForge has
# no API for either: paste publishing/curseforge.html there by hand.
# Needs MODRINTH_ID (variable) and MODRINTH_TOKEN (secret) with the "Write projects" scope.

on:
  workflow_dispatch:
    inputs:
      parts:
        description: 'What to update'
        type: choice
        options: [description and gallery, description, gallery]
        default: description and gallery

permissions:
  contents: read

jobs:
  gallery:
    name: Update the Modrinth page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update the summary and the description
        if: inputs.parts != 'gallery'
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          sys.path.insert(0, '.github/scripts')
          from modrinth_create import USER_AGENT, texts

          summary, body = texts()
          request = urllib.request.Request(
              'https://api.modrinth.com/v2/project/' + os.environ['MODRINTH_ID'], method='PATCH',
              data=json.dumps({'description': summary, 'body': body}).encode(),
              headers={'Authorization': os.environ['MODRINTH_TOKEN'], 'User-Agent': USER_AGENT,
                       'Content-Type': 'application/json'})
          urllib.request.urlopen(request).close()
          print(f'Description updated: {len(body)} characters')
          PY

      - name: Replace the gallery
        if: inputs.parts != 'description'
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          api = 'https://api.modrinth.com/v2/project/' + os.environ['MODRINTH_ID']
          headers = {'Authorization': os.environ['MODRINTH_TOKEN'], 'User-Agent': 'Shamanalle/MultiClicker gallery'}
          shots = [
              ('hud', 'Status panel', 'A mob farm with MultiClicker: the status panel and the highlighted target'),
              ('menu_overview', 'Overview', 'Overview: status, the current session and its goal at a glance'),
              ('menu_clicker', 'Clicker settings', 'Settings: every module is a card, with a tooltip for every option'),
              ('menu_automation', 'Automation', 'Automation: auto farm with a hotkey, auto fish'),
              ('menu_survival', 'Survival', 'Survival: safety, offhand and auto eat'),
              ('menu_visual', 'Visuals', 'Visuals: HUD and target highlight'),
              ('menu_session', 'Session', 'Session: notifications when something needs your attention'),
              ('hud_editor', 'HUD editor', 'HUD editor: drag the panel, snap it to the edges, scale it with the wheel'),
              ('profiles', 'Presets and profiles', 'Presets and your own profiles, with a hotkey, a server and sharing'),
              ('list_editor', 'Block list editor', 'List editor: item icons, add the held item or the block you look at'),
              ('stats', 'Statistics', 'Statistics: the session, each server and all time, with graphs and rates per hour'),
          ]

          def call(method, url, data=None, content_type=None):
              h = dict(headers)
              if content_type:
                  h['Content-Type'] = content_type
              with urllib.request.urlopen(urllib.request.Request(url, data=data, method=method, headers=h)) as r:
                  return r.read()

          old = json.loads(call('GET', api))['gallery']
          for image in old:
              call('DELETE', api + '/gallery?' + urllib.parse.urlencode({'url': image['url']}))
              print('Removed', image.get('title') or image['url'])
          for i, (name, title, description) in enumerate(shots):
              query = urllib.parse.urlencode({'ext': 'png', 'featured': str(i == 0).lower(), 'title': title,
                                              'description': description, 'ordering': i})
              with open(f'docs/images/en/{name}.png', 'rb') as f:
                  call('POST', api + '/gallery?' + query, f.read(), 'image/png')
              print('Added', title)
          PY
