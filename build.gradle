plugins {
    id 'fabric-loom' version '1.18.2' apply false
    id 'maven-publish'
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    version = project.mod_version
    group = project.maven_group

    apply plugin: 'fabric-loom'
    apply plugin: 'maven-publish'

    loom {
        noIntermediateMappings()
        enableTransitiveAccessWideners = false
    }

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven { url "https://maven.terraformersmc.com/releases/"}
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.layered {
            mappings(rootProject.file("mappings.tiny"))
        }
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.toVersion(25)
        targetCompatibility = JavaVersion.toVersion(25)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
        it.options.encoding = "UTF-8"
    }

    tasks.withType(net.fabricmc.loom.task.RemapSourcesJarTask).configureEach {
        enabled = false
    }

    jar {
        from("LICENSE") {
            rename { "${it}_${project.base.archivesName.get()}" }
        }
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                groupId project.group
                artifactId project.base.archivesName.get()
                version project.version
                from components.java
            }
        }

        repositories {
            def token = providers.environmentVariable("SAPS_TOKEN")
            if (token.isPresent()) {
                maven {
                    url "https://maven.saps.dev/releases"
                    credentials {
                        username = "mikeymods"
                        password = token.get()
                    }
                }
            }
        }
    }
}

