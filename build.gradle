plugins {
    id 'dev.architectury.loom' version '1.14-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

// Per-version settings (Fabric API, Mod Menu, source overlays, Java) come from versions/<minecraft_version>.properties.
def versionFile = file("versions/${project.minecraft_version}.properties")
if (!versionFile.exists()) {
    throw new GradleException("Minecraft ${project.minecraft_version} is not supported: ${versionFile} is missing")
}
def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
versionProps.each { key, value -> ext.set(key as String, value) }

// Minecraft versions the jar of a loader is released for (versions/shared-jars.txt): the versions of its group
// when this is the newest of them, else this version alone. "label" names them in the jar file name.
ext.releasedFor = { String loader ->
    def group = file('versions/shared-jars.txt').readLines()
            .findAll { it.trim() && !it.startsWith('#') }
            .collect { it.split(':', 2)*.trim() }
            .find { it[0] == loader && it[1].split(/\s+/).last() == project.minecraft_version }
    def versions = group ? group[1].split(/\s+/) as List : [project.minecraft_version]
    [versions: versions, label: versions.size() == 1 ? versions[0] : "${versions.first()}-${versions.last()}"]
}

// pack.mcmeta for the Forge and NeoForge jars: Forge, and NeoForge for 1.20.2, skip the resources of a mod (its
// translations) that has none. It names the resource pack formats of the versions the jar is released for.
ext.packMetadata = { List<String> versions ->
    def formats = versions.collect { v ->
        def props = new Properties()
        file("versions/${v}.properties").withInputStream { props.load(it) }
        props.getProperty('resource_pack_format').toInteger()
    }
    def oldest = formats.min()
    def newest = formats.max()
    def fields = ['"description": "MultiClicker resources"']
    // Minecraft before 1.21.9 (format 65) reads pack_format and, from 1.20.2, supported_formats; newer ones read
    // min_format and max_format.
    if (oldest < 65) {
        fields << "\"pack_format\": $oldest".toString()
        if (newest != oldest) fields << "\"supported_formats\": [$oldest, $newest]".toString()
    }
    if (newest >= 65) fields << "\"min_format\": $oldest".toString() << "\"max_format\": $newest".toString()
    "{\n  \"pack\": {\n    ${fields.join(',\n    ')}\n  }\n}\n".toString()
}

// Loaders the common code is built for: Forge where the version file names a forge_version (the forge module),
// NeoForge where it names a neoforge_version (the neoforge module; for 1.20.1 the NeoForged Forge, built as a
// Forge mod).
ext.legacyForge = project.minecraft_version == '1.20.1'
ext.platforms = (['fabric']
        + (ext.has('forge_version') || ext.legacyForge ? ['forge'] : [])
        + (ext.has('neoforge_version') && !ext.legacyForge ? ['neoforge'] : [])).join(',')

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    version = project.mod_version
    group = project.maven_group

    // Architectury Loom reads the loader of a module from this property when it is applied.
    if (project.name == 'neoforge') {
        ext.set('loom.platform', rootProject.legacyForge ? 'forge' : 'neoforge')
    } else if (project.name == 'forge') {
        ext.set('loom.platform', 'forge')
    }
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven { url "https://maven.terraformersmc.com/releases/" }
        // Placeholder API, needed by Mod Menu for Minecraft 1.20.3 and 1.20.4.
        maven { url "https://maven.nucleoid.xyz/" }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.toVersion(rootProject.java_version)
        targetCompatibility = JavaVersion.toVersion(rootProject.java_version)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = Integer.parseInt(rootProject.java_version)
        it.options.encoding = "UTF-8"
    }

    // Version specific code: src/compat/<name>/java of each module is layered over src/main/java
    // in the order given by "compat" (a later overlay replaces a file of the same name).
    def compatDir = layout.buildDirectory.dir('compat/java')
    def mergeCompat = tasks.register('mergeCompat', Sync) {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
        into compatDir
        rootProject.compat.split(',').each { name -> from(project.file("src/compat/$name/java")) }
    }
    sourceSets.main.java.srcDir(compatDir)
    tasks.withType(JavaCompile).configureEach { dependsOn mergeCompat }
    tasks.withType(Jar).configureEach { dependsOn mergeCompat }

    jar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${rootProject.archives_name}" }
        }
    }
}
