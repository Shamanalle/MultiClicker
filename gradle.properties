# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G

# Mod properties
mod_version = 2.1.0
maven_group = io.github.shamanalle.multiclicker
archives_name = MultiClicker
enabled_platforms = fabric

# Minecraft version to build; per-version settings are in versions/<minecraft_version>.properties.
# Build another version with -Pminecraft_version=<version>.
minecraft_version = 1.21.8

# Dependencies
fabric_loader_version = 0.16.14
loader_min = 0.16.0

loom.allowMismatchedPlatformVersion = true
