plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Mod Menu is optional: compile against its API and run it in the dev environment only.
    // Mod Menu 4 (Minecraft 1.19 to 1.19.2) brings an older Fabric Loader along, which then sits on the
    // classpath twice.
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

// In-game tests (Fabric client game tests): a separate test mod that is never part of the release jar.
// Run with `./gradlew :fabric:runClientGameTest` (needs a display; CI uses xvfb).
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

dependencies {
    gametestImplementation sourceSets.main.output
}

// Version specific test code: src/compat/<name>/gametest, layered like the main sources of the module.
def gametestCompatDir = layout.buildDirectory.dir('compat/gametest')
def mergeGametestCompat = tasks.register('mergeGametestCompat', Sync) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    into gametestCompatDir
    rootProject.compat.split(',').each { name -> from(project.file("src/compat/$name/gametest")) }
}
sourceSets.gametest.java.srcDir(gametestCompatDir)
tasks.named('compileGametestJava') { dependsOn mergeGametestCompat }

loom {
    mods {
        "multiclicker-gametest" {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        clientGameTest {
            inherit loom.runs.getByName("client")
            name = "Client Game Test"
            source sourceSets.gametest
            property "fabric.client.gametest"
            runDir "build/run/clientGameTest"
        }
    }
}

// The Minecraft versions this jar is released for (versions/shared-jars.txt).
def releasedFor = rootProject.releasedFor('fabric')

processResources {
    def minecraftRange = releasedFor.versions.size() == 1 ? releasedFor.versions[0]
            : ">=${releasedFor.versions.first()} <=${releasedFor.versions.last()}"
    // Fabric API was the mod "fabric" up to its builds for Minecraft 1.19.1, and later builds still provide
    // that id, so a jar released for 1.19 to 1.19.2 asks for "fabric" as the 1.19 build does.
    def oldest = new Properties()
    rootProject.file("versions/${releasedFor.versions[0]}.properties").withInputStream { oldest.load(it) }
    def fabricApiId = oldest.getProperty('fabric_api_id') ?: 'fabric-api'
    inputs.property 'version', project.version
    inputs.property 'minecraft_range', minecraftRange
    inputs.property 'java_version', rootProject.java_version
    inputs.property 'loader_min', rootProject.loader_min
    inputs.property 'fabric_api_id', fabricApiId

    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_range: minecraftRange, java_version: rootProject.java_version, loader_min: rootProject.loader_min,
                fabric_api_id: fabricApiId
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    // MultiClicker-fabric-<mod version>+<minecraft version>.jar, or +<oldest>-<newest> for a shared jar
    archiveVersion = "${rootProject.mod_version}+${releasedFor.label}"
}
